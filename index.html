<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { width: 200px; font-family: Arial, sans-serif; padding: 12px; text-align: center; background-color: #f9f9f9; }
        h3 { margin-bottom: 12px; color: #333; font-size: 15px; }
        button { width: 100%; padding: 10px; font-size: 14px; font-weight: bold; cursor: pointer; border: none; border-radius: 6px; color: white; }
        #btnMulai { background-color: #28a745; margin-bottom: 8px; }
        #btnStop { background-color: #dc3545; }
        #status { margin-top: 12px; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>
    <h3>Auto-Reject 9 Menit</h3>
    <button id="btnMulai">START</button>
    <button id="btnStop">STOP</button>
    <div id="status">Status: Memeriksa...</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnMulai = document.getElementById('btnMulai');
            const btnStop = document.getElementById('btnStop');
            const statusText = document.getElementById('status');

            // Cek status aktif/mati saat popup dibuka
            chrome.storage.local.get(["isAktif"], (result) => {
                if (result.isAktif) {
                    statusText.innerText = "Status: AKTIF 🟢";
                    statusText.style.color = "green";
                } else {
                    statusText.innerText = "Status: BERHENTI 🔴";
                    statusText.style.color = "red";
                }
            });

            // Tombol START diklik
            btnMulai.onclick = function() {
                chrome.storage.local.set({ isAktif: true }, () => {
                    statusText.innerText = "Status: AKTIF 🟢";
                    statusText.style.color = "green";
                    window.close(); // Tutup popup otomatis
                });
            };

            // Tombol STOP diklik
            btnStop.onclick = function() {
                chrome.storage.local.set({ isAktif: false }, () => {
                    statusText.innerText = "Status: BERHENTI 🔴";
                    statusText.style.color = "red";
                    window.close(); // Tutup popup otomatis
                });
            };
        });
    </script>
</body>
</html>
