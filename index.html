<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { width: 220px; font-family: Arial, sans-serif; padding: 12px; text-align: center; background-color: #f9f9f9; }
        h3 { margin-bottom: 12px; color: #333; font-size: 15px; }
        button { width: 100%; padding: 10px; font-size: 14px; font-weight: bold; cursor: pointer; border: none; border-radius: 6px; color: white; margin-bottom: 8px; }
        #btnMulai { background-color: #28a745; }
        #btnStop { background-color: #dc3545; }
        #btnDownloadZip { background-color: #ff9800; margin-top: 4px; }
        #btnDownloadZip:hover { background-color: #e68a00; }
        #status { margin-top: 8px; font-size: 13px; font-weight: bold; }
        .instruksi { font-size: 11px; color: #666; margin-top: 10px; text-align: left; line-height: 1.3; }
    </style>
</head>
<body>
    <h3>Auto-Reject 9 Menit</h3>
    <button id="btnMulai">START</button>
    <button id="btnStop">STOP</button>
    <button id="btnDownloadZip">📦 Download File ZIP Ext</button>
    <div id="status">Status: Memeriksa...</div>
    <div class="instruksi">
        <b>Cara Pakai:</b><br>
        1. Klik tombol ZIP di atas.<br>
        2. Ekstrak file ZIP yang terdownload.<br>
        3. Masuk ke <code>chrome://extensions/</code><br>
        4. Nyalakan <b>Developer mode</b>.<br>
        5. Klik <b>Load unpacked</b> dan pilih folder hasil ekstrak.
    </div>

    <script src="jszip.min.js"></script>
    <script>
        // We can embed base64 strings or construct zip via Blob or base64 data URI directly!
    </script>
</body>
</html>
