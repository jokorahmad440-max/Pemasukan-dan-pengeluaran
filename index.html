<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { width: 200px; font-family: Arial, sans-serif; padding: 12px; text-align: center; background-color: #f9f9f9; }
        h3 { margin-bottom: 12px; color: #333; font-size: 15px; }
        button { width: 100%; padding: 10px; font-size: 14px; font-weight: bold; cursor: pointer; border: none; border-radius: 6px; color: white; transition: 0.2s; }
        #btnMulai { background-color: #28a745; margin-bottom: 8px; }
        #btnMulai:hover { background-color: #218838; }
        #btnStop { background-color: #dc3545; }
        #btnStop:hover { background-color: #c82333; }
        #status { margin-top: 12px; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>
    <h3>Auto-Reject 9 Menit</h3>
    <button id="btnMulai">START</button>
    <button id="btnStop">STOP</button>
    <div id="status">Status: Memeriksa...</div>

    <script>
        const btnMulai = document.getElementById('btnMulai');
        const btnStop = document.getElementById('btnStop');
        const statusText = document.getElementById('status');

        // Perbarui tampilan status saat popup dibuka
        chrome.storage.local.get(["isAktif"], (result) => {
            if (result.isAktif) {
                statusText.innerText = "Status: AKTIF 🟢";
                statusText.style.color = "green";
            } else {
                statusText.innerText = "Status: BERHENTI 🔴";
                statusText.style.color = "red";
            }
        });

        // Klik tombol START
        btnMulai.addEventListener('click', () => {
            chrome.storage.local.set({ isAktif: true }, () => {
                statusText.innerText = "Status: AKTIF 🟢";
                statusText.style.color = "green";
                alert("Otomatisasi Auto-Reject 9 Menit Berhasil Diaktifkan!");
                chrome.tabs.reload(); // Refresh tab aktif agar skrip langsung jalan
            });
        });

        // Klik tombol STOP
        btnStop.addEventListener('click', () => {
            chrome.storage.local.set({ isAktif: false }, () => {
                statusText.innerText = "Status: BERHENTI 🔴";
                statusText.style.color = "red";
                alert("Otomatisasi Berhasil Dihentikan.");
            });
        });
    </script>
</body>
</html>
