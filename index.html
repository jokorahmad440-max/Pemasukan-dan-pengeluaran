<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { width: 220px; font-family: Arial, sans-serif; padding: 12px; text-align: center; background-color: #f9f9f9; }
        h3 { margin-bottom: 12px; color: #333; font-size: 15px; }
        button { width: 100%; padding: 10px; font-size: 14px; font-weight: bold; cursor: pointer; border: none; border-radius: 6px; color: white; margin-bottom: 8px; }
        #btnMulai { background-color: #28a745; }
        #btnMulai:hover { background-color: #218838; }
        #btnStop { background-color: #dc3545; }
        #btnStop:hover { background-color: #c82333; }
        #status { margin-top: 8px; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>
    <h3>Auto-Reject 9 Menit</h3>
    <button id="btnMulai">START</button>
    <button id="btnStop">STOP</button>
    <div id="status">Status: Memeriksa...</div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const btnMulai = document.getElementById("btnMulai");
            const btnStop = document.getElementById("btnStop");
            const statusDiv = document.getElementById("status");

            // Cek status saat pertama kali dibuka
            chrome.storage.local.get(["isAktif"], (result) => {
                if (result.isAktif) {
                    statusDiv.textContent = "Status: AKTIF 🟢";
                    statusDiv.style.color = "green";
                } else {
                    statusDiv.textContent = "Status: NONAKTIF 🔴";
                    statusDiv.style.color = "red";
                }
            });

            // Aksi tombol START
            btnMulai.onclick = () => {
                chrome.storage.local.set({ isAktif: true }, () => {
                    statusDiv.textContent = "Status: AKTIF 🟢";
                    statusDiv.style.color = "green";
                    console.log("Diaktifkan");
                });
            };

            // Aksi tombol STOP
            btnStop.onclick = () => {
                chrome.storage.local.set({ isAktif: false }, () => {
                    statusDiv.textContent = "Status: NONAKTIF 🔴";
                    statusDiv.style.color = "red";
                    console.log("Dimatikan");
                });
            };
        });
    </script>
</body>
</html>
